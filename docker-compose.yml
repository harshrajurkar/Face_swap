services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      EXECUTION_PROVIDER: CPUExecutionProvider
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/models:/app/models

  worker:
    build:
      context: ./backend
    command: python -m worker.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      EXECUTION_PROVIDER: CPUExecutionProvider
    depends_on:
      - redis
      - backend
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/models:/app/models

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
