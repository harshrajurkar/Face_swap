services:
  backend:
    image: ${BACKEND_IMAGE_URI}
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL}
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES}
      STORAGE_MODE: ${STORAGE_MODE}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_UPLOADS_PREFIX: ${S3_UPLOADS_PREFIX}
      S3_OUTPUTS_PREFIX: ${S3_OUTPUTS_PREFIX}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${BACKEND_IMAGE_URI}
    command: python -m worker.worker
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL}
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES}
      STORAGE_MODE: ${STORAGE_MODE}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_UPLOADS_PREFIX: ${S3_UPLOADS_PREFIX}
      S3_OUTPUTS_PREFIX: ${S3_OUTPUTS_PREFIX}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_RUNTIME_IMAGE}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=%(protocol)s://%(domain)s/prometheus
      - --web.route-prefix=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: prom-operator
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"

volumes:
  prometheus_data:
  grafana_data:
