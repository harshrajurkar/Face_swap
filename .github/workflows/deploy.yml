name: CI/CD - Face Swap Deploy

on:
  push:
    branches: [v1.0.31]

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: ai-face-swap
  ENVIRONMENT: dev
  ECR_BACKEND_REPO: ai-face-swap-backend
  ECR_FRONTEND_REPO: ai-face-swap-frontend
  DEPLOY_TARGET_TAG: face-swap-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        id: build_push
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_TAG="sha-${GITHUB_SHA}"

          BACKEND_IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPO}:${IMAGE_TAG}"
          FRONTEND_IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPO}:${IMAGE_TAG}"

          docker build -t "${BACKEND_IMAGE_URI}" ./app/backend
          docker push "${BACKEND_IMAGE_URI}"
          docker tag "${BACKEND_IMAGE_URI}" "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPO}:latest"
          docker push "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPO}:latest"

          docker build -t "${FRONTEND_IMAGE_URI}" ./app/frontend
          docker push "${FRONTEND_IMAGE_URI}"
          docker tag "${FRONTEND_IMAGE_URI}" "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPO}:latest"
          docker push "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPO}:latest"

          echo "backend_image_uri=${BACKEND_IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "frontend_image_uri=${FRONTEND_IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        shell: bash
        env:
          BACKEND_IMAGE_URI: ${{ steps.build_push.outputs.backend_image_uri }}
          FRONTEND_IMAGE_URI: ${{ steps.build_push.outputs.frontend_image_uri }}
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:DeployTarget,Values=${DEPLOY_TARGET_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "No running instance found with DeployTarget=${DEPLOY_TARGET_TAG}" >&2
            exit 1
          fi

          # Fix: discover the live OpenTofu-created bucket so CI does not keep stale S3_BUCKET_NAME values.
          STORAGE_BUCKET="$(aws s3api list-buckets \
            --query "sort_by(Buckets[?starts_with(Name, '${PROJECT_NAME}-${ENVIRONMENT}-storage-')], &CreationDate)[-1].Name" \
            --output text)"

          if [[ -z "${STORAGE_BUCKET}" || "${STORAGE_BUCKET}" == "None" ]]; then
            echo "No S3 bucket found with prefix ${PROJECT_NAME}-${ENVIRONMENT}-storage-" >&2
            exit 1
          fi

          COMMANDS_JSON="$(jq -cn \
            --arg backend "${BACKEND_IMAGE_URI}" \
            --arg frontend "${FRONTEND_IMAGE_URI}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg bucket "${STORAGE_BUCKET}" \
            '[
              "set -eu",
              "ENV_FILE=/opt/ai-face-swap/.env.runtime",
              "test -f \"$ENV_FILE\"",
              "# Fix: keep runtime branch, bucket, and image values synced with the current CI deployment.",
              "sed -i \"s|^GIT_BRANCH=.*$|GIT_BRANCH='\''" + $branch + "'\''|\" \"$ENV_FILE\"",
              "sed -i \"s|^S3_BUCKET_NAME=.*$|S3_BUCKET_NAME='\''" + $bucket + "'\''|\" \"$ENV_FILE\"",
              "sed -i \"s|^BACKEND_IMAGE_URI=.*$|BACKEND_IMAGE_URI='\''" + $backend + "'\''|\" \"$ENV_FILE\"",
              "sed -i \"s|^FRONTEND_RUNTIME_IMAGE=.*$|FRONTEND_RUNTIME_IMAGE='\''" + $frontend + "'\''|\" \"$ENV_FILE\"",
              "ENV_FILE=\"$ENV_FILE\" bash /opt/scripts/deploy-ec2-single.sh"
            ]')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=${COMMANDS_JSON}" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command ID: ${COMMAND_ID}"

          STATUS="Pending"
          for attempt in {1..120}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")"

            echo "SSM status after $((attempt * 15))s: ${STATUS}"

            case "${STATUS}" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 15
          done

          echo "SSM status: ${STATUS}"
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query "StandardErrorContent" --output text

          if [[ "${STATUS}" != "Success" ]]; then
            exit 1
          fi
