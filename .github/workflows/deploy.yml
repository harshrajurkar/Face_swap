name: CI/CD - Face Swap Deploy

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: 132690414014
  ECR_BACKEND: ai-face-swap-backend
  ECR_FRONTEND: ai-face-swap-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # AWS Auth
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------
      # Build & Push Backend
      # ----------------------------
      - name: Build backend image
        run: |
          docker build -t backend ./app/backend
          docker tag backend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest

      # ----------------------------
      # Build & Push Frontend
      # ----------------------------
      - name: Build frontend image
        run: |
          docker build -t frontend ./app/frontend
          docker tag frontend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest

      # ----------------------------
      # Deploy via SSM
      # ----------------------------
      - name: Deploy via SSM
        run: |
          echo "Starting SSM deployment..."

          # Get instance ID from tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:DeployTarget,Values=face-swap-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Target Instance ID: $INSTANCE_ID"

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: No instance found"
            exit 1
          fi

          # Send SSM command - create .env file using echo chain, then run docker compose
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
"cd /opt/ai-face-swap/app",
"aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com",
"echo BACKEND_IMAGE_URI='"$ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/ai-face-swap-backend:latest > .env",
"echo FRONTEND_RUNTIME_IMAGE='"$ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/ai-face-swap-frontend:latest >> .env",
"echo REDIS_URL=redis://redis:6379/0 >> .env",
"echo EXECUTION_PROVIDER=CPUExecutionProvider >> .env",
"echo WORKER_CONCURRENCY=1 >> .env",
"echo WORKER_JOB_TIMEOUT_SECONDS=900 >> .env",
"echo WORKER_MAX_RETRIES=2 >> .env",
"echo STORAGE_MODE=local >> .env",
"echo APP_SHARED_DIR=/opt/ai-face-swap >> .env",
"echo CORS_ORIGINS=* >> .env",
"echo PUBLIC_BASE_URL=http://localhost >> .env",
"echo S3_BUCKET_NAME=dummy >> .env",
"echo S3_UPLOADS_PREFIX=uploads >> .env",
"echo S3_OUTPUTS_PREFIX=outputs >> .env",
"docker compose --env-file .env -f docker-compose.aws.yml pull",
"docker compose --env-file .env -f docker-compose.aws.yml up -d --remove-orphans"
]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for completion
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID || true

          # Get output
          echo "=== OUTPUT ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "StandardOutputContent" \
            --output text

          echo "=== ERRORS ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "StandardErrorContent" \
            --output text

          # Check status
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "Status" \
            --output text)

          echo "Final Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi