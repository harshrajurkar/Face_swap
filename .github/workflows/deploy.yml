name: CI/CD - Face Swap Deploy

on:
push:
branches: [ main ]

env:
AWS_REGION: ap-south-1
ACCOUNT_ID: 132690414014
ECR_BACKEND: ai-face-swap-backend
ECR_FRONTEND: ai-face-swap-frontend

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  # ----------------------------
  # Checkout
  # ----------------------------
  - name: Checkout code
    uses: actions/checkout@v4

  # ----------------------------
  # AWS Auth
  # ----------------------------
  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region:            ${{ env.AWS_REGION }}

  - name: Login to Amazon ECR
    uses: aws-actions/amazon-ecr-login@v2

  # ----------------------------
  # Build & Push Backend
  # ----------------------------
  - name: Build backend image
    run: |
      docker build -t backend ./app/backend
      docker tag backend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest
      docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest

  # ----------------------------
  # Build & Push Frontend
  # ----------------------------
  - name: Build frontend image
    run: |
      docker build -t frontend ./app/frontend
      docker tag frontend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest
      docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest

  # ----------------------------
  # Deploy via SSM
  # ----------------------------
  - name: Deploy via SSM
    run: |
      echo "Starting SSM deployment..."

      COMMAND_ID=$(aws ssm send-command \
        --targets "Key=tag:DeployTarget,Values=face-swap-dev" \
        --document-name "AWS-RunShellScript" \
        --parameters commands="cd /opt/ai-face-swap/app && docker compose pull && docker compose up -d --remove-orphans" \
        --query "Command.CommandId" \
        --output text)

      echo "SSM Command ID: $COMMAND_ID"

      INSTANCE_ID=$(aws ssm describe-instance-information \
        --filters "Key=tag:DeployTarget,Values=face-swap-dev" \
        --query "InstanceInformationList[0].InstanceId" \
        --output text)

      echo "Target Instance ID: $INSTANCE_ID"

      echo "Waiting for command to complete..."
      aws ssm wait command-executed \
        --command-id $COMMAND_ID \
        --instance-id $INSTANCE_ID

      echo "Fetching command output..."
      aws ssm get-command-invocation \
        --command-id $COMMAND_ID \
        --instance-id $INSTANCE_ID \
        --query "StandardOutputContent" \
        --output text
```
