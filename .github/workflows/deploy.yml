name: CI/CD - Face Swap Deploy

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: 132690414014
  ECR_BACKEND: ai-face-swap-backend
  ECR_FRONTEND: ai-face-swap-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # AWS Auth
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------
      # Build & Push Backend
      # ----------------------------
      - name: Build backend image
        run: |
          docker build -t backend ./app/backend
          docker tag backend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:latest

      # ----------------------------
      # Build & Push Frontend
      # ----------------------------
      - name: Build frontend image
        run: |
          docker build -t frontend ./app/frontend
          docker tag frontend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:latest

      # ----------------------------
      # Deploy via SSM
      # ----------------------------
      - name: Deploy via SSM
        run: |
          echo "Starting SSM deployment..."

          # First, get the instance ID from the tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:DeployTarget,Values=face-swap-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Target Instance ID: $INSTANCE_ID"

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: No instance found with tag DeployTarget=face-swap-dev"
            exit 1
          fi

          # Send command to the specific instance
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="cd /opt/ai-face-swap/app && git pull origin main && cp docker-compose.aws.yml docker-compose.yml && docker compose pull && docker compose up -d --remove-orphans" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete (with timeout)
          echo "Waiting for command to complete..."
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            2>/dev/null || true

          # Get output regardless of status
          echo "=== Command Output ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "StandardOutputContent" \
            --output text

          echo "=== Command Errors ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "StandardErrorContent" \
            --output text

          # Check final status
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "Status" \
            --output text)

          echo "Final Command Status: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi